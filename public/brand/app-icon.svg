<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CATROT app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD873"/>
      <stop offset="0.5" stop-color="#FFB341"/>
      <stop offset="1" stop-color="#FF9C24"/>
    </linearGradient>
    <clipPath id="tileClip"><rect width="512" height="512" rx="115" ry="115"/></clipPath>
    <clipPath id="headClip"><ellipse cx="256" cy="312" rx="205" ry="205"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#tile)"/>

    <!-- paws, peeking out at the bottom corners -->
    <g fill="#FFB03C" stroke="#3B2A1E" stroke-width="13" stroke-linejoin="round">
      <path d="M -78 528 q 16 -140 106 -140 q 90 0 106 140 z"/>
      <path d="M 378 528 q 16 -140 106 -140 q 90 0 106 140 z"/>
    </g>

    <!-- ears -->
    <g stroke="#3B2A1E" stroke-width="14" stroke-linejoin="round">
      <path d="M 84 186 C 90 92 108 40 143 40 C 178 40 222 72 253 108 Z" fill="#FFA82F"/>
      <path d="M 428 186 C 422 92 404 40 369 40 C 334 40 290 72 259 108 Z" fill="#FFA82F"/>
    </g>
    <g fill="#FF9EB5">
      <path d="M 116 164 C 121 104 131 74 149 74 C 167 74 194 95 212 114 Z"/>
      <path d="M 396 164 C 391 104 381 74 363 74 C 345 74 318 95 300 114 Z"/>
    </g>

    <!-- head -->
    <ellipse cx="256" cy="312" rx="205" ry="205" fill="#FFFBF2"/>
    <g clip-path="url(#headClip)" fill="#FFA82F">
      <ellipse cx="440" cy="292" rx="172" ry="238" transform="rotate(6 440 292)"/>
      <ellipse cx="200" cy="172" rx="70" ry="44" transform="rotate(-16 200 172)"/>
    </g>
    <ellipse cx="256" cy="312" rx="205" ry="205" fill="none" stroke="#3B2A1E" stroke-width="14"/>

    <!-- whiskers -->
    <g stroke="#3B2A1E" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M 2 292 q 58 -10 108 4"/>
      <path d="M -2 350 q 56 4 104 22"/>
      <path d="M 510 292 q -58 -10 -108 4"/>
      <path d="M 514 350 q -56 4 -104 22"/>
    </g>

    <!-- eyes -->
    <g fill="#3B2A1E">
      <ellipse cx="174" cy="290" rx="47" ry="55"/>
      <ellipse cx="338" cy="290" rx="47" ry="55"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="158" cy="270" r="16.5"/>
      <circle cx="190" cy="299" r="8.5"/>
      <circle cx="322" cy="270" r="16.5"/>
      <circle cx="354" cy="299" r="8.5"/>
    </g>

    <!-- muzzle -->
    <path d="M 218 378 q 0 76 38 76 q 38 0 38 -76 z" fill="#F2647F" stroke="#3B2A1E" stroke-width="13" stroke-linejoin="round"/>
    <path d="M 229 420 q 27 -15 54 0 q -6 29 -27 29 q -21 0 -27 -29 z" fill="#FF9EB5"/>
    <path d="M 204 361 q 25 29 52 11 q 27 18 52 -11" fill="none" stroke="#3B2A1E" stroke-width="13" stroke-linecap="round"/>
    <path d="M 256 373 q -29 0 -31 -19 q 10 -11 31 -11 q 21 0 31 11 q -2 19 -31 19 z" fill="#FF9EB5" stroke="#3B2A1E" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
